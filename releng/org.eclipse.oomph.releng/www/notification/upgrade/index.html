<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link href="https://eclipseide.org/favicon.ico" rel="icon" type="image/x-icon" />
	<title>Java 25 Upgrade</title>
	<link rel="preconnect stylesheet" href="../notification.css?v=1.0" />
	<style>
		/* <![CDATA[*/
		#product-logo {
			max-width: 1.2em;
			margin-bottom: -0.2em;
		}

		.ide-wg-member-logo {
			vertical-align: bottom;
			max-width: 4.5em;
			max-height: 1.5em;
		}

		.ide-wg-member-logo-container {
			border-radius: .2em;
			height: 1.8em;
			padding: .3em .4em;
			margin: .15em .1em;
		}

		/*]]>*/
	</style>
	<script src="../notification.js?v=1.5"></script>
	<script>
		//<![CDATA[
		const version = '2026-09';
		const javaVersion = '25';
		const productName = getProductName();
		document.title = `${productName} ${version} - Java ${javaVersion} Upgrade`;

		function update() {
			updateInnerInnerHTML('.version', version);
			updateInnerInnerHTML('.javaVersion', javaVersion);
			updateInnerInnerHTML('.product-name', productName);
			document.getElementById('product-logo').src = getProductImage();
		}
		//]]>
	</script>
</head>

<body id="body">
	<div class="main">
		<div id="content">
			<table style="display: none;">
				<tbody id="query">
					<tr>
						<th>Property</th>
						<th>Value</th>
					</tr>
					<tr>
						<td>property</td>
						<td>value</td>
					</tr>
				</tbody>
			</table>

			<div id="general">
				<div class="section">
					The <span class="version">version</span> version
					of the
					<img id="product-logo" src="" alt="" />
					<span class="product-name">product-name</span>
					will require Java <span class="javaVersion">java version</span> to run.
				</div>
				<div class="section">
					Would you like to upgrade this IDE to run with Java 25 now
					so that you will be able to update to the 2026-09 version?
				</div>
				<div class="button-section">
					<label class="button">
						<a href="eclipse+setup:Upgrade.setup">Upgrade this IDE</a>
					</label>
					&nbsp;
					<label class="button">
						<a href="eclipse+command:close">Ask Me Later</a>
					</label>
					&nbsp;
					<label class="button">
						<a href="eclipse+command:dismiss-installation">No Thank You</a>
					</label>
				</div>
				<div id="ide-wg" class="section" style="display: none">
					<hr />
					Sponsored by <b>people like you</b> and by the <a href="eclipse+external:https://eclipseide.org/working-group/#about">IDE Working Group</a>.
					<br />
				</div>
				<div class="section">
				</div>
			</div>
		</div>
	</div>

	<script>
		load();
		update();
		generate(true);
	</script>
</body>

</html>
